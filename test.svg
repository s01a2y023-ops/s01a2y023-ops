<svg fill="none" width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <style>
    .card {
      background-color: #282a36; /* 顯式設定深色背景 */
      width: 100%;
      height: 100%;
      padding: 30px;
      box-sizing: border-box;
      font-family: sans-serif;
    }
    h1 { color: #ff79c6; margin-top: 0; }
    p { color: #f8f8f2; }
  </style>

  
    <foreignObject width="100%" height="100%">
        <div class="card">
        <h1>深色卡片標題</h1>
        <p>這是一個使用深色背景的卡片範例。你可以在這裡添加更多內容。</p>
        </div>
    </foreignObject>
</svg>
    


  
    