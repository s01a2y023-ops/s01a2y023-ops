<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300">
  <title>Larry's Profile</title>

  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e84393"/>
      <stop offset="0.52" stop-color="#7c5cbf"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <clipPath id="text-clip">
      <rect x="20" y="50" width="220" height="200">
        <animate attributeName="width" values="220;30;50;68;86;110;140;168;185;220;220;220;185;168;140;110;86;68;50;30;220" dur="7s" calcMode="discrete" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="920" height="300" rx="20" fill="#f7f3ec"/>
  <rect x="1" y="1" width="918" height="298" rx="19" fill="none" stroke="#e4dbd0"/>

  <text x="30" y="75" fill="#7c5cbf" font-family="'Cascadia Code', Consolas, monospace" font-size="30">Hi There! I'm</text>
  <text x="355" y="35" fill="#217a32" font-family="'Cascadia Code', Consolas, monospace" font-size="13">CityU HK Year3 CS Student</text>

  <text x="30" y="123" fill="#c2256a" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="40" font-weight="700" clip-path="url(#text-clip)">Larry Chan</text>
  <rect x="32" y="134" width="230" height="4" rx="2" fill="url(#accent)"/>
  <text x="32" y="172" fill="#c2256a" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="16">Still Learning for Coding, trying to understand more tech stack</text>

  <text x="32" y="208" fill="#c2256a" font-family="'Cascadia Code', Consolas, monospace" font-size="16">&#10095;</text>
  <text x="54" y="208" fill="#282a36" font-family="'Cascadia Code', Consolas, monospace" font-size="16">Programming
    <animate attributeName="opacity" values="1;1;0;0;0;0" dur="9s" repeatCount="indefinite" calcMode="discrete"/>
  </text>
  <text x="54" y="208" fill="#282a36" font-family="'Cascadia Code', Consolas, monospace" font-size="16" opacity="0">API Design
    <animate attributeName="opacity" values="0;0;1;1;0;0" dur="9s" repeatCount="indefinite" calcMode="discrete"/>
  </text>
  <text x="54" y="208" fill="#282a36" font-family="'Cascadia Code', Consolas, monospace" font-size="16" opacity="0">Structure Design
    <animate attributeName="opacity" values="0;0;0;0;1;1" dur="9s" repeatCount="indefinite" calcMode="discrete"/>
  </text>
  <rect x="228" y="194" width="5" height="18" rx="1" fill="#282a36">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <g font-family="'Segoe UI', Ubuntu, sans-serif" font-size="13" fill="#282a36">
    <rect x="32" y="236" width="112" height="30" rx="15" fill="#fffdf9" stroke="#e4dbd0"/>
    <text x="88" y="256" text-anchor="middle">Frontend</text>
    <rect x="154" y="236" width="112" height="30" rx="15" fill="#fffdf9" stroke="#e4dbd0"/>
    <text x="210" y="256" text-anchor="middle">Backend</text>
    <rect x="276" y="236" width="132" height="30" rx="15" fill="#fffdf9" stroke="#e4dbd0"/>
    <text x="342" y="256" text-anchor="middle">API</text>
  </g>

  <rect x="548" y="64" width="340" height="196" rx="16" fill="#fffdf9" stroke="#e4dbd0"/>
  <text x="572" y="96" fill="#8a8194" font-family="'Cascadia Code', Consolas, monospace" font-size="12">Most Familiar stack</text>
  <rect x="568" y="112" width="300" height="36" rx="8" fill="#f3d3e4">
    <animate attributeName="y" values="112;156;200;112" dur="4.5s" repeatCount="indefinite" calcMode="discrete"/>
  </rect>
  <g font-family="'Cascadia Code', Consolas, monospace" font-size="14">
    <text x="584" y="136" fill="#217a32">01</text>
    <text x="620" y="136" fill="#282a36">JS / TS</text>
    <text x="760" y="136" fill="#8a8194">language</text>
    <text x="584" y="180" fill="#0e7490">02</text>
    <text x="620" y="180" fill="#282a36">HTML / CSS</text>
    <text x="760" y="180" fill="#8a8194">markup</text>
    <text x="584" y="224" fill="#7c5cbf">03</text>
    <text x="620" y="224" fill="#282a36">SQL</text>
    <text x="760" y="224" fill="#8a8194">data</text>
  </g>

  <g transform="translate(65, 60)">
    <animateTransform attributeName="transform" type="translate" additive="sum" values="-40,0;-18,0;2,0;16,0;32,0;56,0;92,0;120,0;135,0;168,0;168,0;135,0;120,0;92,0;56,0;32,0;16,0;2,0;-18,0;-40,0" dur="7s" calcMode="discrete" repeatCount="indefinite"/>
    <circle cx="10" cy="60" r="1" fill="#0e7490">
      <animate attributeName="opacity" values="1; 0; 1" dur="0.5s" calcMode="discrete" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="60" r="1" fill="#0e7490">
      <animate attributeName="opacity" values="1; 0; 1" dur="0.5s" calcMode="discrete" repeatCount="indefinite"/>
    </circle>
    <circle cx="30" cy="60" r="1" fill="#0e7490">
      <animate attributeName="opacity" values="1; 0; 1" dur="0.5s" calcMode="discrete" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
